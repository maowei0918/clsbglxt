name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: 后端回归 + 变异自检
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: 安装依赖
        working-directory: server
        # 清掉可能继承自宿主机的 PYTHONPATH，避免 pip 误判系统包已满足而漏装依赖
        run: |
          unset PYTHONPATH
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # pytest 不在 requirements.txt（生产不依赖），CI 单独装
          python -m pip install pytest

      - name: 全量回归
        working-directory: server
        run: |
          unset PYTHONPATH
          python -m pytest tests/ -q

      - name: 变异自检（验证测试有效性）
        working-directory: server
        run: |
          unset PYTHONPATH
          python scripts/mutation_check.py

      - name: 工作区污染兜底
        working-directory: server
        run: |
          # 三道独立兜底，任何一道不过即让整个 job 变红
          # 1) 变异脚本改过的生产代码必须已还原（变异测试最大的风险是留毒）
          git diff --exit-code -- app/ || {
            echo "::error::变异自检未还原对生产代码的改动！"; exit 1; }
          # 2) 测试不得在 server/ 留下 .env（历史上被测试改写导致全站 token 失效）
          [ ! -f .env ] || { echo "::error::测试意外创建了 .env"; exit 1; }
          # 3) 安装期残留必须清掉
          for f in data/.install_done data/.install.running data/.install_rl.json .env.tmp; do
            [ ! -e "$f" ] || { echo "::error::遗留安装期残留 $f"; exit 1; }
          done
          echo "工作区干净 ✓"

      - name: 上传失败诊断（仅当失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          # 只捞日志类文件，避免把整个 server/ 打上去
          path: |
            server/*.log
            server/logs/
          if-no-files-found: ignore
          retention-days: 7
