[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# 占位：实际 URL 由 alembic/env.py 从 app.core.config 读取
sqlalchemy.url = postgresql+psycopg2://clglxt:changeme@localhost:5432/clglxt

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
