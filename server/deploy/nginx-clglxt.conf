# ============================================================
# clglxt Nginx 反代配置
# 宝塔面板：网站 → 设置 → 配置文件，粘贴本文件内容
#
# 设计说明（重要）：
#   ★ 后端 FastAPI 自己托管前端静态文件（main.py StaticFiles 挂载在 /）
#   ★ nginx 【不做】静态文件服务，全部 proxy_pass 到后端
#   ★ /install、/login 是后端直接生成的 HTML 页面，必须透传
#   ★ 后端 502 时：
#     - 首页 /  → nginx error_page 502 → 静态 guide.html（纯 HTML，不触发 Vue）
#     - /api/   → Vue 入口的 fetch('/api/healthz') 失败 → 渲染 SetupGuide 组件
#     - 两层互为兜底，任一都能展示引导页
# ============================================================

upstream clglxt_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# 限流区：登录接口 5 次/分钟、普通接口 30 次/秒
limit_req_zone $binary_remote_addr zone=clglxt_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=clglxt_api:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name clglxt.example.com;   # ← 改成你的域名
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name clglxt.example.com;   # ← 改成你的域名

    # ── SSL（宝塔一键 Let's Encrypt 生成的路径）────────────────────────
    ssl_certificate     /www/server/panel/vhost/cert/clglxt/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/clglxt/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # ── 安全响应头（后端也会发，这里兜底）─────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;

    # ── 上传大小限制（与 CLGLXT_MAX_ORDER_UPLOAD_MB 对齐）───────
    client_max_body_size 50m;
    client_body_timeout  120s;
    client_body_buffer_size 1m;

    # ── 超时（AI 审核 / 报表导出可能较慢）───────────────────────
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    # ── 日志 ─────────────────────────────────────────
    access_log /var/log/clglxt/nginx.access.log;
    error_log  /var/log/clglxt/nginx.error.log warn;

    # ── Gzip ─────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml;

    # ── 后端挂了时的静态引导页（502 → 返回 guide.html，不触发 Vue）──
    # 注意：error_page 不要加 "="，保留 502 状态码，监控探活才能正确判废；
    #       另需 proxy_intercept_errors on 才会拦截上游 502（common 里是 off）。
    error_page 502 503 504 /guide.html;
    location = /guide.html {
        root /www/server/nginx/html/clglxt-fallback;
        access_log off;
        internal;              # 外部不可直连，只作 error_page 目标
        add_header Cache-Control "no-store" always;
    }

    # ── 登录接口限流 ──────────────────────────────────
    location = /api/auth/login {
        limit_req zone=clglxt_login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://clglxt_backend;
        include /etc/nginx/clglxt_proxy_params.conf;
    }

    # ── 健康检查（不拦截错误码，让前端探针拿到真实状态）────────
    location = /api/healthz {
        access_log off;
        proxy_pass http://clglxt_backend;
        include /etc/nginx/clglxt_proxy_params.conf;
    }

    # ── 后端 API ─────────────────────────────────────
    location /api/ {
        limit_req zone=clglxt_api burst=50 nodelay;
        limit_req_status 429;
        proxy_pass http://clglxt_backend;
        include /etc/nginx/clglxt_proxy_params.conf;
    }

    # ── 媒体文件（上传的图片/附件，Nginx 直发，省后端带宽）────────
    location /data/ {
        alias /var/www/clglxt/data/;
        # 防盗链：只允许自家域名引用
        valid_referers none blocked server_names clglxt.example.com;
        if ($invalid_referer) { return 403; }
        expires 7d;
        add_header Cache-Control "public";
        # 禁止执行脚本
        location ~* \.(php|py|sh|cgi|pl)$ { deny all; }
    }

    # ── 其他所有路径 → 后端托管（静态 / install / login / SPA）────────
    location / {
        proxy_pass http://clglxt_backend;
        include /etc/nginx/clglxt_proxy_params.conf;
    }

    # ── 隐藏文件拦截 ──────────────────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }
}
